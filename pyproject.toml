[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "mlx-taef"
description = "Tiny AutoEncoders for diffusion on Apple Silicon — live previews + low-memory decode for FLUX, SD, and Qwen-Image."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Denis Ineshin", email = "denis.ineshin@gmail.com" }]
keywords = [
  "mlx", "apple-silicon", "diffusion", "stable-diffusion",
  "flux", "mflux", "qwen-image", "taesd", "taef", "taef1", "taef2",
  "tiny-autoencoder", "vae", "latent-preview", "autoencoder",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: MacOS X",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
  "mlx>=0.20",
  "numpy>=1.26",
  "huggingface-hub>=0.24",
  "safetensors>=0.4",
]

[project.optional-dependencies]
# No upper bound on mflux, by policy: the newest mflux release is tested weekly and fixed only
# when it breaks something. mflux 0.24 is the floor: it is the first release that imports on
# Pillow 13.
mflux = ["mflux>=0.24"]
# Pillow 12.x and older are affected by GHSA-5x8w-8jj5-q52h, fixed in Pillow 13; every Pillow
# requirement here starts at 13.
image = ["Pillow>=13"]
showcase = [
  "mflux>=0.24",
  "mlx-teacache>=0.14.0,<1",
  "Pillow>=13",
  "scikit-image>=0.22",
]

[project.urls]
Homepage = "https://github.com/IonDen/mlx-taef"
Source = "https://github.com/IonDen/mlx-taef"
Issues = "https://github.com/IonDen/mlx-taef/issues"
Changelog = "https://github.com/IonDen/mlx-taef/blob/main/CHANGELOG.md"
Comparison = "https://github.com/IonDen/mlx-taef/blob/main/COMPARISON.md"
Roadmap = "https://github.com/IonDen/mlx-taef/blob/main/ROADMAP.md"

[project.scripts]
mlx-taef = "mlx_taef.cli:main"

[dependency-groups]
test = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.130",
  "pytest-benchmark>=4.0",
  "mflux>=0.24",
  "mlx-teacache>=0.14.0,<1",
  "scikit-image>=0.22",
  "Pillow>=13",
]
typecheck = [
  "mypy>=1.13",
  # mypy --strict on src/mlx_taef needs PIL's types resolvable — integrations/mflux.py
  # imports it. (Previously this was masked by uv's implicit "dev" default group
  # pulling in Pillow from the test/fixtures groups; now that default-groups = []
  # scopes each CI sync to exactly its own group, typecheck must declare it directly.)
  "Pillow>=13",
]
lint = [
  "ruff>=0.7",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.27",
]
# Reference-fixture generation only. Not for runtime.
fixtures = [
  "torch>=2.4,<3",
  "pillow>=13",
  "lpips>=0.1.4",
]
dev = [
  { include-group = "test" },
  { include-group = "typecheck" },
  { include-group = "lint" },
  { include-group = "docs" },
  { include-group = "fixtures" },
  "pre-commit>=3.8",
]

[tool.uv]
# uv installs the "dev" default group on every `uv sync` unless this is set —
# including a bare `uv sync --group test`/`--group lint`/`--group typecheck`,
# which would otherwise silently pull in every other group (fixtures' torch +
# lpips included) regardless of which single group was requested. Each CI job
# asks for exactly one group and should get exactly one group; local full-dev
# setup already opts in explicitly via `uv sync --all-groups`.
default-groups = []

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/mlx_taef/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mlx_taef"]
# hatchling >= 1.32 emits Metadata-Version 2.5, which the release workflow's twine (6.2.0,
# bundled by the build action) rejects; 2.4 is read by every tool in the release path.
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
# Allowlist: ship only the source package, user-facing docs, examples, and license.
# Everything else stays out by construction — the test suite (its large parity fixtures
# under tests/converted/ and tests/reference/ are excluded, so the tests can't run from an
# sdist anyway), local tool state (.claude/, .codegraph/), and generated showcase output
# (_artifacts/) — so a local `uv build` can't leak machine-specific files into the archive.
only-include = [
  "src/mlx_taef",
  "examples",
  "docs",
  "README.md",
  "CHANGELOG.md",
  "COMPARISON.md",
  "EXAMPLES.md",
  "PREVIEW.md",
  "ROADMAP.md",
  "LICENSE",
]
exclude = [
  "docs/assets/*.gif",
  "docs/superpowers/",
  "**/__pycache__",
]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "W", "F",
  "I",
  "B",
  "UP",
  "RUF",
  "SIM",
  "C4",
  "PIE", "PT", "RET",
  "PTH",
  "TID",
  "TCH",
  "N",
  "D",
  "ANN",
  "PYI",
  "PERF",
  "FURB",
  "NPY",
]
ignore = [
  "ANN401",
  "E501",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ANN", "S101"]
"tests/_third_party/**/*.py" = ["ALL"]
"examples/**/*.py" = ["D", "ANN"]

[tool.ruff.format]
docstring-code-format = true
exclude = ["tests/_third_party/**/*.py"]  # vendored; preserve original formatting

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]
files = ["src/mlx_taef"]

[[tool.mypy.overrides]]
# mflux has no py.typed marker; the type: ignore comment must list both
# import-untyped (mflux installed) and import-not-found (mflux absent,
# e.g. typecheck venv on Linux). One code is always unused depending on
# the environment, so suppress warn_unused_ignores for this module.
module = "mlx_taef.integrations.mflux"
warn_unused_ignores = false


[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
xfail_strict = true
markers = [
  "network: real network I/O (HF downloads); skipped by default, opt in with --run-network",
  "benchmark: perf timing test; skipped by default, opt in with --run-benchmark",
]

[tool.coverage.run]
branch = true
source = ["mlx_taef"]
parallel = true
omit = ["src/mlx_taef/_version.py"]  # generated by hatch-vcs; no user code

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "@overload",
  "raise NotImplementedError",
]
show_missing = true
fail_under = 95
