name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job only reads the repository; no job overrides this.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.11.2
      - name: Check uv.lock matches pyproject.toml
        # Every sync below is --frozen, which installs the lockfile as written; this fails
        # the run when pyproject.toml changed without a lock refresh.
        run: uv lock --check
      - name: Sync
        run: uv sync --frozen --group lint
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Build distributions
        # hatch-vcs needs a version; the shallow checkout has no tags to derive one from.
        run: uv build
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"
      - name: Check distributions with the release action's twine
        # twine is pinned to the version bundled by hynek/build-and-inspect-python-package
        # v2.18.0 (the release.yml pin), so a metadata/tooling mismatch fails here instead
        # of on the tag push.
        run: uvx twine==6.2.0 check --strict dist/*

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.11.2
      - name: Sync
        run: uv sync --frozen --group typecheck
      - name: Mypy
        run: uv run mypy src/mlx_taef

  test:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: pip install uv==0.11.2
      - name: Sync (test group only — keep CI light)
        run: uv sync --frozen --group test
      - name: Run unit + parity tests
        run: |
          uv run pytest \
            --cov=mlx_taef \
            --cov-report=term-missing \
            --cov-fail-under=95 \
            -m "not benchmark and not network"

  test-mflux-floor:
    # The lockfile resolves mflux to the newest minor on macOS; this leg runs the offline
    # suite on mflux 0.19, the oldest minor the extras admit (`>=0.19`). Every `uv run` here
    # needs `--no-sync`: a plain `uv run` re-syncs to the lockfile and silently puts the
    # locked mflux back. The 95% coverage gate runs in the `test` matrix; this leg has none
    # because one older mflux can cover different lines.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.11.2
      - name: Sync (test group only)
        run: uv sync --frozen --group test
      - name: Install mflux 0.19 (no dependency changes)
        run: uv pip install --no-deps "mflux==0.19.*"
      - name: Check mflux 0.19 is installed and imports
        run: |
          uv run --no-sync python -c '
          import importlib.metadata as md
          import mflux
          import mflux.callbacks.callback_registry
          import mflux.callbacks.generation_context
          import mflux.models.common.config.model_config
          mflux_version, mlx_version = md.version("mflux"), md.version("mlx")
          print(f"mflux {mflux_version}, mlx {mlx_version}")
          if not mflux_version.startswith("0.19."):
              raise SystemExit(f"expected mflux 0.19.x, got {mflux_version}")
          '
      - name: Run unit + parity tests
        run: uv run --no-sync pytest -m "not benchmark and not network"
