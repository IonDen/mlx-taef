name: mflux latest
on:
  schedule:
    # Mondays, 06:00 UTC. GitHub disables a scheduled workflow in a public repository after 60
    # days without repository activity, so a quiet spell ends the weekly check until someone
    # re-enables it in the Actions tab; any push before then restarts the 60 days.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# The job only reads the repository.
permissions:
  contents: read

jobs:
  test-mflux-latest:
    # mlx-taef sets no upper bound on mflux, so each new mflux release reaches users before a
    # pull request here runs against it. This job moves only mflux to its newest release over
    # the frozen test sync (mlx, Pillow and the rest move only when that release requires a
    # newer version) and runs the offline suite; a release that breaks something turns it red.
    # When the job goes red, check first whether mlx moved: the printed versions show whether
    # the new mflux pulled a newer mlx (or Pillow) in, and a failure may come from that.
    # Every `uv run` here needs `--no-sync`: a plain `uv run` re-syncs to the lockfile and
    # silently puts the locked mflux back.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.11.2
      - name: Sync (test group only)
        run: uv sync --frozen --group test
      - name: Upgrade mflux alone to the newest release
        run: uv pip install --upgrade-package mflux mflux
      - name: Print the mflux, mlx and Pillow under test
        run: |
          uv run --no-sync python -c '
          import importlib.metadata as md
          mflux_version, mlx_version = md.version("mflux"), md.version("mlx")
          pillow_version = md.version("pillow")
          print(f"mflux {mflux_version}, mlx {mlx_version}, Pillow {pillow_version}")
          '
      - name: Check mflux and the modules the suite needs import
        # The mflux tests skip when these modules do not import, so a release that moves or
        # breaks one would leave the suite green; importing them here turns that red.
        run: |
          uv run --no-sync python -c '
          import mflux
          import mflux.callbacks.callback_registry
          import mflux.callbacks.generation_context
          import mflux.models.common.config.model_config
          '
      - name: Run unit + parity tests offline
        env:
          HF_HUB_OFFLINE: "1"
        run: uv run --no-sync pytest -m "not benchmark and not network"
